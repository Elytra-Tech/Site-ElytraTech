<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Registrar</title>
    <link rel="stylesheet" href="PagLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-fundo"></div>

    <section class="login-section">
        <div class="login-container">

            <h1 class="login-title">Login</h1>

            <form class="login-form" action="process_login.php" method="POST">
                <input class="Inputs-In" id="DataLog" type="text" name="username" placeholder="Usuario" required>
                <input class="Inputs-In" id="password" type="password" name="password" placeholder="Senha" required>

                <p id="ErrorMessage">Login ou Senha incorretos.</p>

                <button class="login-button" id="loginButton" type="submit">Entrar</button>
                <button class="return-btn" type="button" onclick="window.location.href='index.html'">Voltar</button>
            </form>

            <p class="login-text">Não tem uma conta? <a href="PagRegistrar.html" class="register-link">Registrar</a></p>

        </div>
    </section>

<script>
    const inputUsuario = document.getElementById('DataLog');
    const inputSenha = document.getElementById('password');
    const botaoLogin = document.getElementById('loginButton');
    const msgErro = document.getElementById('ErrorMessage'); // O <p> de erro no HTML de login

    botaoLogin.addEventListener('click', async function(event) {
        event.preventDefault();

        const usuario = inputUsuario.value;
        const senha = inputSenha.value;

        // Validação se há campos vazios
        if (usuario === "" || senha === "") {
            botaoLogin.style.borderColor = 'red';
            msgErro.style.color = 'red';
            msgErro.textContent = 'Por favor, preencha todos os campos.';
            msgErro.style.display = 'block';
            return;
        }

        try {
            const resposta = await fetch('https://site-elytratech.onrender.com/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, senha })
            });

            const resultado = await resposta.json();

            if (resultado.sucesso) {
                botaoLogin.style.borderColor = '';
                msgErro.style.color = 'green';
                msgErro.textContent = 'Login efetuado com sucesso!';
                msgErro.style.display = 'block';

                setTimeout(() => {
                    // Substitui 'dashboard.html' pela página para onde queres ir após entrar
                    window.location.href = 'editor.html'; 
                }, 1000);
            } else {
                botaoLogin.style.borderColor = 'red';
                msgErro.style.color = 'red';
                msgErro.textContent = resultado.mensagem; // Ex: "Usuário/Email ou senha incorretos."
                msgErro.style.display = 'block';
            }

        } catch (erro) {
            console.error('Erro ao conectar com o servidor:', erro);
            botaoLogin.style.borderColor = 'red';
            msgErro.style.color = 'red';
            msgErro.textContent = 'Erro de conexão com o servidor.';
            msgErro.style.display = 'block';
        }
    });

    // Limpa o erro ao começar a digitar
    inputUsuario.addEventListener('input', () => {
        botaoLogin.style.borderColor = '';
        msgErro.style.display = 'none';
    });

    inputSenha.addEventListener('input', () => {
        botaoLogin.style.borderColor = '';
        msgErro.style.display = 'none';
    });
</script>
    
</body>
</html>
