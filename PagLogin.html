<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="PagLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <section class="login-section">
        <div class="login-container">

            <h1 class="login-title">Login</h1>

            <form class="login-form">
                <input class="Inputs-In" id="email" type="email" placeholder="Email" required>
                <input class="Inputs-In" id="password" type="password" placeholder="Senha" required>

                <p id="ErrorMessage"></p>

                <button class="login-button" id="loginButton" type="submit">Entrar</button>
                <button class="return-btn" type="button" onclick="window.location.href='index.html'">Voltar</button>
            </form>

            <p class="login-text">Não tem uma conta? <a href="PagRegistrar.html" class="register-link">Registrar</a> ou <a style="text-decoration: none; color: var(--pink);" href="AdmRegister.html">Registar Admin</a></p>

        </div>
    </section>

<script type="module">
import { auth, traduzErro } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

const form = document.querySelector('.login-form');
const inputEmail = document.getElementById('email');
const inputSenha = document.getElementById('password');
const botao = document.getElementById('loginButton');
const msgErro = document.getElementById('ErrorMessage');

function mostrar(texto, cor) {
    msgErro.style.color = cor;
    msgErro.textContent = texto;
    msgErro.style.display = 'block';
    botao.style.borderColor = cor === 'red' ? 'red' : '';
}

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = inputEmail.value.trim();
    const senha = inputSenha.value;

    if (!email || !senha) {
        mostrar('Por favor, preencha todos os campos.', 'red');
        return;
    }

    botao.disabled = true;

    try {
        await signInWithEmailAndPassword(auth, email, senha);
        mostrar('Login efetuado com sucesso!', 'green');
        setTimeout(() => window.location.href = 'index.html', 800);
    } catch (erro) {
        mostrar(traduzErro(erro.code), 'red');
        botao.disabled = false;
    }
});

[inputEmail, inputSenha].forEach(i => i.addEventListener('input', () => {
    botao.style.borderColor = '';
    msgErro.style.display = 'none';
}));
</script>

</body>
</html>
