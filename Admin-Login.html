<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - ElytraTech</title>
    <link rel="stylesheet" href="PagLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="PagLogin.css">
</head>
<body>

    <section class="login-section">
        <div class="login-container">

            <h1 class="login-title">Login Admin</h1>

            <form class="login-form">
                <input class="Inputs-In" id="email" type="email" placeholder="E-mail de Administrador" required>
<div class="input-wrapper" style="position: relative; width: 100%; display: flex; align-items: center;">
    <input class="Inputs-In" id="password" type="password" placeholder="Senha (mínimo 6 caracteres)" required style="width: 100%; padding-right: 45px;">
    <button type="button" id="togglePassword" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--line); display: flex; align-items: center; justify-content: center; padding: 0; z-index: 10;">
        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </button>
</div>

                <p id="ErrorMessage"></p>

                <button class="login-button" id="loginButton" type="submit">Entrar como Admin</button>
                <button class="return-btn" type="button" onclick="window.location.href='index.html'">Voltar</button>
            </form>

            <p class="login-text" style="text-align: center; margin-top: 15px;">
                Não tem conta admin? <a href="AdmRegister.html" class="register-link">Registar</a>
            </p>

        </div>
    </section>

    <script type="module">
import { auth, db, traduzErro } from "./firebase.js";
import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const form = document.querySelector('.login-form');
const inputEmail = document.getElementById('email');
const inputSenha = document.getElementById('password');
const botao = document.getElementById('loginButton');
const msgErro = document.getElementById('ErrorMessage');

function mostrar(texto, cor) {
    msgErro.style.color = cor;
    msgErro.textContent = texto;
    msgErro.style.display = 'block';
    botao.style.borderColor = cor === 'red' ? 'red' : '';
}

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = inputEmail.value.trim();
    const senha = inputSenha.value;

    if (!email || !senha) {
        mostrar('Por favor, preencha todos os campos.', 'red');
        return;
    }

    botao.disabled = true;

    try {
        const cred = await signInWithEmailAndPassword(auth, email, senha);
        const adminSnap = await getDoc(doc(db, 'admins', cred.user.uid));

        if (!adminSnap.exists()) {
            await signOut(auth);
            mostrar('Acesso negado: esta conta não é de Administrador.', 'red');
            botao.disabled = false;
            return;
        }

        mostrar('Login de Administrador efetuado com sucesso!', 'green');
        setTimeout(() => window.location.href = 'index.html', 800);
    } catch (erro) {
        mostrar(traduzErro(erro.code), 'red');
        botao.disabled = false;
    }
});

[inputEmail, inputSenha].forEach(i => {
    if (i) {
        i.addEventListener('input', () => {
            botao.style.borderColor = '';
            msgErro.style.display = 'none';
        });
    }
});

// === CONTROLO DO BOTÃO DE VER/OCULTAR SENHA ===
const togglePasswordBtn = document.getElementById('togglePassword');
const eyeIcon = document.getElementById('eyeIcon');

if (togglePasswordBtn && inputSenha && eyeIcon) {
    togglePasswordBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = inputSenha.getAttribute('type') === 'password';
        
        inputSenha.setAttribute('type', isPassword ? 'text' : 'password');
        
        if (isPassword) {
            // Olho cortado/fechado
            eyeIcon.innerHTML = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
        } else {
            // Olho aberto
            eyeIcon.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
        }
    });
}
</script>

</body>
</html>
