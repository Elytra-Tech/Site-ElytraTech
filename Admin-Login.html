<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - ElytraTech</title>
    <link rel="stylesheet" href="PagLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="PagLogin.css">
</head>
<body>

    <section class="login-section">
        <div class="login-container">

            <h1 class="login-title">Login Admin</h1>

            <form class="login-form">
                <input class="Inputs-In" id="email" type="email" placeholder="E-mail de Administrador" required>
                <input class="Inputs-In" id="password" type="password" placeholder="Senha" required>

                <p id="ErrorMessage"></p>

                <button class="login-button" id="loginButton" type="submit">Entrar como Admin</button>
                <button class="return-btn" type="button" onclick="window.location.href='index.html'">Voltar</button>
            </form>

            <p class="login-text" style="text-align: center; margin-top: 15px;">
                Não tem conta admin? <a href="PagAdminRegister.html" class="register-link">Registar</a>
            </p>

        </div>
    </section>

</body>
</html>
