<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar Administrador - ElytraTech</title>
    <link rel="stylesheet" href="PagLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    
    <section class="login-section">
        <div class="register-container">

            <h1 class="register-title">Registar Admin</h1>

            <form class="login-form">
                <input class="Inputs-In" id="DataLog" type="text" placeholder="Nome de Utilizador" required>
                <input class="Inputs-In" id="email" type="email" placeholder="Email de Administrador" required>
                
                <!-- Input de Chave Secreta de Admin -->
                <input class="Inputs-In" id="adminKey" type="password" placeholder="Chave de Acesso Secreta" required>

                <!-- Campo de Senha com o Botão do Olho Integrado -->
                <div class="input-wrapper" style="position: relative; width: 100%; display: flex; align-items: center;">
                    <input class="Inputs-In" id="password" type="password" placeholder="Senha (mínimo 6 caracteres)" required style="width: 100%; padding-right: 45px;">
                    <button type="button" id="togglePassword" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--line); display: flex; align-items: center; justify-content: center; padding: 0; z-index: 10;">
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <p id="ErrorMessage"></p>

                <button class="login-button" id="loginButton" type="submit">Criar Conta Admin</button>
                <button class="return-btn" type="button" onclick="window.location.href='index.html'">Voltar</button>

                <p style="text-align: center; margin-top: 5px;">Já tem conta? <a href="Admin-Login.html" class="register-link">Faça login de Admin</a></p>
                <p style="text-align: center; margin-top: 5px;">Já tem conta? <a href="PagLogin.html" class="register-link">Faça login</a></p>
            </form>

        </div>
    </section>

    <script type="module">
        import { auth, db, traduzErro } from "./firebase.js";
        import { createUserWithEmailAndPassword, updateProfile } 
            from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } 
            from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        // Chave secreta mestra definida para liberar contas de administrador
        const CHAVE_MESTRA_ADMIN = "ElytraAdmin2026!";

        const form = document.querySelector('.login-form');
        const inputUsuario = document.getElementById('DataLog');
        const inputEmail = document.getElementById('email');
        const inputSenha = document.getElementById('password');
        const inputAdminKey = document.getElementById('adminKey');
        const botao = document.getElementById('loginButton');
        const msgErro = document.getElementById('ErrorMessage');

        function mostrar(texto, cor) {
            msgErro.style.color = cor;
            msgErro.textContent = texto;
            msgErro.style.display = 'block';
            botao.style.borderColor = cor === 'red' ? 'red' : '';
        }

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const usuario = inputUsuario.value.trim();
    const email = inputEmail.value.trim();
    const senha = inputSenha.value;
    const adminKey = inputAdminKey.value;

    if (!usuario || !email || !senha || !adminKey) {
        mostrar('Por favor, preencha todos os campos.', 'red');
        return;
    }

    if (adminKey !== CHAVE_MESTRA_ADMIN) {
        mostrar('Chave de Acesso Secreta inválida!', 'red');
        return;
    }

    botao.disabled = true;

    try {
        // 1. Cria no Auth
        const cred = await createUserWithEmailAndPassword(auth, email, senha);
        await updateProfile(cred.user, { displayName: usuario });

        // 2. Cria no Firestore
        await setDoc(doc(db, 'admins', cred.user.uid), {
            usuario,
            email,
            role: 'admin',
            criadoEm: serverTimestamp()
        });

        mostrar('Conta de Administrador criada com sucesso!', 'green');
        
        // Aguarda 1.2 segundos e entra no site já logado como Administrador
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1200);

    } catch (erro) {
        console.error("Erro no registo:", erro);
        mostrar(traduzErro(erro.code) || 'Ocorreu um erro. Tente novamente.', 'red');
        botao.disabled = false; // Só reativa o botão se der erro
    }
});

        // Limpar erros ao escrever nos inputs existentes
        [inputUsuario, inputEmail, inputSenha, inputAdminKey].forEach(i => {
            if (i) {
                i.addEventListener('input', () => {
                    botao.style.borderColor = '';
                    msgErro.style.display = 'none';
                });
            }
        });

        // === CONTROLO DO BOTÃO DE VER/OCULTAR SENHA ===
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        if (togglePasswordBtn && inputSenha && eyeIcon) {
            togglePasswordBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const isPassword = inputSenha.getAttribute('type') === 'password';
                
                inputSenha.setAttribute('type', isPassword ? 'text' : 'password');
                
                if (isPassword) {
                    // Olho cortado/fechado
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                } else {
                    // Olho aberto
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                }
            });
        }
    </script>
</body>
</html>
