<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="PagLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <section class="login-section">
        <div class="register-container">

            <h1 class="register-title">Registrar</h1>

            <form class="login-form">
                <input class="Inputs-In" id="DataLog" type="text" placeholder="Usuário" required>
                <input class="Inputs-In" id="numero" maxlength="11" type="tel" placeholder="Número de telefone" required>
                <input class="Inputs-In" id="email" type="email" placeholder="Email" required>
                <input class="Inputs-In" id="password" type="password" placeholder="Senha (mínimo 6 caracteres)" required>
                <p id="ErrorMessage"></p>
                <button class="login-button" id="loginButton" type="submit">Registrar</button>
                <button class="return-btn" type="button" onclick="window.location.href='index.html'">Voltar</button>
                <p>Já tem uma conta? <a href="PagLogin.html" class="register-link">Faça login</a></p>
            </form>

        </div>
    </section>

<script type="module">
import { auth, db, traduzErro } from "./firebase.js";
import { createUserWithEmailAndPassword, updateProfile }
    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const form = document.querySelector('.login-form');
const inputUsuario = document.getElementById('DataLog');
const inputTelefone = document.getElementById('numero');
const inputEmail = document.getElementById('email');
const inputSenha = document.getElementById('password');
const botao = document.getElementById('loginButton');
const msgErro = document.getElementById('ErrorMessage');

function mostrar(texto, cor) {
    msgErro.style.color = cor;
    msgErro.textContent = texto;
    msgErro.style.display = 'block';
    botao.style.borderColor = cor === 'red' ? 'red' : '';
}

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const usuario = inputUsuario.value.trim();
    const telefone = inputTelefone.value.trim();
    const email = inputEmail.value.trim();
    const senha = inputSenha.value;

    if (!usuario || !telefone || !email || !senha) {
        mostrar('Por favor, preencha todos os campos.', 'red');
        return;
    }

    botao.disabled = true;

    try {
        const cred = await createUserWithEmailAndPassword(auth, email, senha);
        await updateProfile(cred.user, { displayName: usuario });
        await setDoc(doc(db, 'users', cred.user.uid), {
            usuario, telefone, email, criadoEm: serverTimestamp()
        });

        mostrar('Usuário cadastrado com sucesso!', 'green');
        setTimeout(() => window.location.href = 'index.html', 1200);
    } catch (erro) {
        mostrar(traduzErro(erro.code), 'red');
        botao.disabled = false;
    }
});

[inputUsuario, inputTelefone, inputEmail, inputSenha].forEach(i =>
    i.addEventListener('input', () => {
        botao.style.borderColor = '';
        msgErro.style.display = 'none';
    })
);
</script>

</body>
</html>
